server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # The canonical error URL renders the styled page but keeps the 404 status.
    location = /404 {
        return 404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
